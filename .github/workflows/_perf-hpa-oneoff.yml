name: (oneoff) Validacao HPA no PR

# TEMPORARIO — usado so para validar o job de escalabilidade (HPA) neste branch
# antes do merge, ja que workflow_dispatch exige o workflow no branch default.
# Sera REMOVIDO apos coletar a evidencia de scale-up. Dispara so neste branch.

on:
  push:
    branches:
      - add-load-scaling-tests

permissions:
  contents: read

jobs:
  hpa:
    uses: ./.github/workflows/perf-run.yml
    with:
      test_type: hpa
