name: CI/CD - Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Run automated tests (unit + coverage gate 80%)
  # ---------------------------------------------------------------------------
  test:
    name: Tests + Coverage (gate 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - name: Run unit tests with coverage
        run: npm run test:unit:cov
      - name: Check coverage gate (80%)
        run: |
          COVERAGE=$(grep -oP '(?<=Lines.*?\s)\d+\.\d+' coverage/unit/lcov-report/index.html | head -1)
          echo "Line coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below gate 80%"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% meets gate 80%"
      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: coverage/unit/lcov.info
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Build Docker image (multi-stage, optimizado para produção)
  # ---------------------------------------------------------------------------
  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build application
        run: npm run build

      - name: Build Docker image with native docker command
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Save Docker image to tarball
        run: |
          mkdir -p /tmp/docker-image
          docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -o /tmp/docker-image/image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-image
          path: /tmp/docker-image/image.tar
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 3. Pipeline status summary
  # ---------------------------------------------------------------------------
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    needs: [test, build-docker]
    if: always()
    steps:
      - name: Check pipeline status
        run: |
          if [ "${{ needs.test.result }}" = "failure" ] || \
             [ "${{ needs.build-docker.result }}" = "failure" ]; then
            echo "❌ Pipeline FAILED"
            exit 1
          fi
          echo "✅ Pipeline PASSED - All jobs completed successfully"
