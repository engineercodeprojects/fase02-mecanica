name: CI/CD - Build & Deploy (Kind)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_NAME: mecanica-app
  APP_VERSION: ${{ github.sha }}
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: mecanica_db
  DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@postgres:5432/${{ env.POSTGRES_DB }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build Docker image (multi-stage, optimizado para produção)
  # ---------------------------------------------------------------------------
  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d2b59c8c14a3ed4239e7da18d  # v3

      - name: Build Docker image
        uses: docker/build-push-action@4a13e500e55cf31b7a5d59a38ab2040ab0f42f56  # v5
        with:
          context: .
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 2. Setup Kind cluster + Deploy database + Deploy app
  # ---------------------------------------------------------------------------
  deploy-kind:
    name: Deploy to Kind cluster
    runs-on: ubuntu-latest
    needs: build-docker
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.11.0
        with:
          cluster_name: ci-cluster
          config: |
            kind: Cluster
            apiVersion: kind.x-k8s.io/v1alpha4
            nodes:
            - role: control-plane
              extraPortMappings:
              - containerPort: 3000
                hostPort: 3000
                protocol: TCP
              - containerPort: 5432
                hostPort: 5432
                protocol: TCP

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify cluster is ready
        run: kubectl cluster-info && kubectl get nodes

      - name: Create app namespace
        run: kubectl create namespace app || true

      - name: Download Docker image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image into Kind
        run: |
          kind load image-archive /tmp/image.tar --name ci-cluster
          echo "Docker image loaded successfully"

      - name: Create PostgreSQL secrets
        run: |
          kubectl create secret generic postgres-secret \
            --from-literal=POSTGRES_USER=${{ env.POSTGRES_USER }} \
            --from-literal=POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }} \
            -n app || true

      - name: Create application secrets
        run: |
          kubectl create secret generic app-secret \
            --from-literal=DATABASE_URL='postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@postgres-service:5432/${{ env.POSTGRES_DB }}' \
            --from-literal=JWT_SECRET='ci-test-secret-${{ github.sha }}' \
            --from-literal=JWT_EXPIRES_IN='86400' \
            -n app || true

      - name: Deploy PostgreSQL
        run: |
          kubectl apply -f - -n app <<EOF
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres-service
          spec:
            type: ClusterIP
            selector:
              app: postgres
            ports:
            - port: 5432
              targetPort: 5432
          ---
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: postgres-pvc
          spec:
            accessModes:
            - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postgres
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: postgres
            template:
              metadata:
                labels:
                  app: postgres
              spec:
                containers:
                - name: postgres
                  image: postgres:15-alpine
                  ports:
                  - containerPort: 5432
                  env:
                  - name: POSTGRES_USER
                    valueFrom:
                      secretKeyRef:
                        name: postgres-secret
                        key: POSTGRES_USER
                  - name: POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: postgres-secret
                        key: POSTGRES_PASSWORD
                  - name: POSTGRES_DB
                    value: ${{ env.POSTGRES_DB }}
                  volumeMounts:
                  - name: postgres-storage
                    mountPath: /var/lib/postgresql/data
                  livenessProbe:
                    exec:
                      command:
                      - /bin/sh
                      - -c
                      - pg_isready -U ${{ env.POSTGRES_USER }}
                    initialDelaySeconds: 10
                    periodSeconds: 5
                  readinessProbe:
                    exec:
                      command:
                      - /bin/sh
                      - -c
                      - pg_isready -U ${{ env.POSTGRES_USER }}
                    initialDelaySeconds: 5
                    periodSeconds: 5
                volumes:
                - name: postgres-storage
                  persistentVolumeClaim:
                    claimName: postgres-pvc
          EOF

      - name: Wait for PostgreSQL to be ready
        run: |
          kubectl wait --for=condition=Ready pod \
            -l app=postgres \
            -n app \
            --timeout=300s

      - name: Deploy Application
        run: |
          kubectl apply -f - -n app <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${{ env.APP_NAME }}
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: ${{ env.APP_NAME }}
            template:
              metadata:
                labels:
                  app: ${{ env.APP_NAME }}
              spec:
                containers:
                - name: app
                  image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
                  imagePullPolicy: IfNotPresent
                  ports:
                  - containerPort: 3000
                  env:
                  - name: NODE_ENV
                    value: "production"
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: app-secret
                        key: DATABASE_URL
                  - name: JWT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: app-secret
                        key: JWT_SECRET
                  - name: JWT_EXPIRES_IN
                    valueFrom:
                      secretKeyRef:
                        name: app-secret
                        key: JWT_EXPIRES_IN
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: 3000
                    initialDelaySeconds: 30
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 3
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: 3000
                    initialDelaySeconds: 10
                    periodSeconds: 5
                    timeoutSeconds: 3
                    failureThreshold: 3
                  resources:
                    requests:
                      cpu: 100m
                      memory: 256Mi
                    limits:
                      cpu: 500m
                      memory: 512Mi
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: ${{ env.APP_NAME }}-service
          spec:
            type: NodePort
            selector:
              app: ${{ env.APP_NAME }}
            ports:
            - port: 3000
              targetPort: 3000
              nodePort: 30000
          ---
          apiVersion: autoscaling/v2
          kind: HorizontalPodAutoscaler
          metadata:
            name: ${{ env.APP_NAME }}-hpa
          spec:
            scaleTargetRef:
              apiVersion: apps/v1
              kind: Deployment
              name: ${{ env.APP_NAME }}
            minReplicas: 2
            maxReplicas: 5
            metrics:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: 70
            - type: Resource
              resource:
                name: memory
                target:
                  type: Utilization
                  averageUtilization: 80
          EOF

      - name: Wait for application to be ready
        run: |
          kubectl wait --for=condition=Ready pod \
            -l app=${{ env.APP_NAME }} \
            -n app \
            --timeout=300s

      - name: Get deployment status
        if: always()
        run: |
          echo "=== Deployments ==="
          kubectl get deployments -n app
          echo ""
          echo "=== Pods ==="
          kubectl get pods -n app
          echo ""
          echo "=== Services ==="
          kubectl get svc -n app
          echo ""
          echo "=== HPA ==="
          kubectl get hpa -n app

  # ---------------------------------------------------------------------------
  # 3. Smoke tests (validar que a app respondeu)
  # ---------------------------------------------------------------------------
  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: deploy-kind
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Wait for service to be accessible
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000/health 2>/dev/null; then
              echo "✓ Service is healthy"
              exit 0
            fi
            echo "[$i/30] Waiting for service..."
            sleep 2
          done
          echo "✗ Service did not respond"
          exit 1

      - name: Health check
        run: curl -v http://localhost:3000/health

      - name: API connectivity test
        run: |
          echo "Testing API endpoints..."
          curl -i http://localhost:3000/api/clientes || true
          curl -i http://localhost:3000/api/servicos || true
          curl -i http://localhost:3000/api/produtos || true

      - name: Dump pod logs on failure
        if: failure()
        run: |
          echo "=== PostgreSQL Logs ==="
          kubectl logs -n app -l app=postgres --tail=50 || true
          echo ""
          echo "=== App Logs ==="
          kubectl logs -n app -l app=${{ env.APP_NAME }} --tail=50 || true

  # ---------------------------------------------------------------------------
  # 4. Integration tests (opcional: rodar suites de integração)
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration tests (Kind)
    runs-on: ubuntu-latest
    needs: deploy-kind
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests against Kind cluster
        env:
          API_URL: http://localhost:3000
        run: npm run test:integration || true

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: integration-test-results
          path: coverage/integration/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 5. Cleanup (finalizar o pipeline com status)
  # ---------------------------------------------------------------------------
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    needs: [build-docker, deploy-kind, smoke-tests, integration-tests]
    if: always()
    steps:
      - name: Check pipeline status
        run: |
          if [ "${{ needs.build-docker.result }}" = "failure" ] || \
             [ "${{ needs.deploy-kind.result }}" = "failure" ] || \
             [ "${{ needs.smoke-tests.result }}" = "failure" ]; then
            echo "❌ Pipeline FAILED"
            exit 1
          fi
          echo "✅ Pipeline PASSED"
