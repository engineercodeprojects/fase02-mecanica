name: CI/CD - Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Run automated tests (unit + coverage gate 80%)
  # ---------------------------------------------------------------------------
  test:
    name: Tests + Coverage (gate 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - name: Run unit tests with coverage
        run: npm run test:unit:cov
      - name: Check coverage gate (80%)
        run: |
          COVERAGE=$(grep -oP '(?<=Lines.*?\s)\d+\.\d+' coverage/unit/lcov-report/index.html | head -1)
          echo "Line coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below gate 80%"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% meets gate 80%"
      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: coverage/unit/lcov.info
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Build Docker image (multi-stage, optimizado para produção)
  # ---------------------------------------------------------------------------
  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build application
        run: npm run build

      - name: Build Docker image with native docker command
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Save Docker image to tarball
        run: |
          mkdir -p /tmp/docker-image
          docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -o /tmp/docker-image/image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-image
          path: /tmp/docker-image/image.tar
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 3. Deploy to Kubernetes (Kind cluster)
  # ---------------------------------------------------------------------------
  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [test, build-docker]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Create Kind cluster
        uses: helm/kind-action@v1.11.0
        with:
          cluster_name: ci-cluster

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify cluster is ready
        run: |
          echo "Cluster info:"
          kubectl cluster-info
          echo "Nodes:"
          kubectl get nodes

      - name: Download Docker image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-image
          path: /tmp/docker-image

      - name: Load Docker image into Kind
        run: |
          kind load image-archive /tmp/docker-image/image.tar --name ci-cluster
          echo "✅ Docker image loaded to cluster"

      - name: Create namespace
        run: kubectl create namespace mecanica || true

      - name: Deploy database (PostgreSQL)
        run: |
          kubectl apply -f - -n mecanica <<'EOF'
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: postgres-config
          data:
            POSTGRES_DB: mecanica_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: "postgres"
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postgres
            labels:
              app: postgres
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: postgres
            template:
              metadata:
                labels:
                  app: postgres
              spec:
                containers:
                - name: postgres
                  image: postgres:15-alpine
                  ports:
                  - containerPort: 5432
                  envFrom:
                  - configMapRef:
                      name: postgres-config
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres
            labels:
              app: postgres
          spec:
            selector:
              app: postgres
            ports:
            - port: 5432
              targetPort: 5432
            type: ClusterIP
          EOF
          echo "✅ PostgreSQL deployed"

      - name: Wait for PostgreSQL to be ready
        run: |
          kubectl rollout status deployment/postgres -n mecanica --timeout=2m || true
          sleep 5

      - name: Deploy application
        run: |
          kubectl apply -f - -n mecanica <<'EOF'
          apiVersion: v1
          kind: Secret
          metadata:
            name: app-secrets
          type: Opaque
          stringData:
            DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/mecanica_db"
            JWT_SECRET: "ci-test-secret"
            JWT_EXPIRES_IN: "86400"
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: mecanica-app
            labels:
              app: mecanica-app
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: mecanica-app
            template:
              metadata:
                labels:
                  app: mecanica-app
              spec:
                containers:
                - name: app
                  image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
                  imagePullPolicy: IfNotPresent
                  ports:
                  - containerPort: 3000
                  env:
                  - name: NODE_ENV
                    value: "production"
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: app-secrets
                        key: DATABASE_URL
                  - name: JWT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: app-secrets
                        key: JWT_SECRET
                  - name: JWT_EXPIRES_IN
                    valueFrom:
                      secretKeyRef:
                        name: app-secrets
                        key: JWT_EXPIRES_IN
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: mecanica-app
            labels:
              app: mecanica-app
          spec:
            selector:
              app: mecanica-app
            ports:
            - protocol: TCP
              port: 3000
              targetPort: 3000
            type: LoadBalancer
          ---
          apiVersion: autoscaling/v2
          kind: HorizontalPodAutoscaler
          metadata:
            name: mecanica-app-hpa
          spec:
            scaleTargetRef:
              apiVersion: apps/v1
              kind: Deployment
              name: mecanica-app
            minReplicas: 1
            maxReplicas: 3
            metrics:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: 70
          EOF
          echo "✅ Application deployed with HPA"

      - name: Wait for application to be ready
        run: |
          kubectl rollout status deployment/mecanica-app -n mecanica --timeout=2m || true
          sleep 5

      - name: Check deployment status
        run: |
          echo "=== Deployments ==="
          kubectl get deployments -n mecanica
          echo ""
          echo "=== Pods ==="
          kubectl get pods -n mecanica
          echo ""
          echo "=== Services ==="
          kubectl get svc -n mecanica
          echo ""
          echo "=== HPA ==="
          kubectl get hpa -n mecanica

  # ---------------------------------------------------------------------------
  # 4. Verify deployment (Smoke tests)
  # ---------------------------------------------------------------------------
  verify-deployment:
    name: Verify Kubernetes deployment
    runs-on: ubuntu-latest
    needs: deploy-k8s
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Check cluster health
        run: |
          echo "✅ Checking cluster status..."
          kubectl cluster-info
          kubectl get nodes

      - name: Check pods status
        run: |
          echo "✅ Checking pods..."
          kubectl get pods -n mecanica -o wide
          kubectl describe pod -n mecanica | head -50 || true

  # ---------------------------------------------------------------------------
  # 3. Pipeline status summary
  # ---------------------------------------------------------------------------
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    needs: [test, build-docker, deploy-k8s, verify-deployment]
    if: always()
    steps:
      - name: Check pipeline status
        run: |
          echo "=== CI/CD Pipeline Summary ==="
          echo "✅ Test job: ${{ needs.test.result }}"
          echo "✅ Build Docker: ${{ needs.build-docker.result }}"
          echo "✅ Deploy K8S: ${{ needs.deploy-k8s.result }}"
          echo "✅ Verify: ${{ needs.verify-deployment.result }}"
          echo ""
          if [ "${{ needs.test.result }}" = "failure" ] || \
             [ "${{ needs.build-docker.result }}" = "failure" ] || \
             [ "${{ needs.deploy-k8s.result }}" = "failure" ]; then
            echo "❌ Pipeline FAILED"
            exit 1
          fi
          echo "✅ Pipeline PASSED"
