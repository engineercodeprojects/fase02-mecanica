# Deployment da API (NestJS). 2 replicas iniciais; o HPA escala a partir dai.
#
# Config: ConfigMap `oficina-app-config` (nao sensivel) + Secret `oficina-app`
# (segredos da app) via envFrom, e DATABASE_URL do Secret `oficina-db`
# (gerado pelo Terraform, US-F2-06) via secretKeyRef.
#
# Probes usam o health check da US-F2-11:
#   - /health        -> liveness  (processo de pe; NAO toca o banco)
#   - /health/ready  -> readiness (faz SELECT 1; 503 se o banco cair)
# Com isso um pod so recebe trafego quando o banco esta acessivel.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-app
  labels:
    app.kubernetes.io/name: oficina-app
    app.kubernetes.io/part-of: oficina-mecanica
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oficina-app
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oficina-app
        app.kubernetes.io/part-of: oficina-mecanica
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Evita crashloop enquanto o Postgres ainda nao aceita conexao.
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Aguardando ${DB_HOST}:${DB_PORT}..."
              until nc -z "$DB_HOST" "$DB_PORT"; do sleep 2; done
              echo "Banco disponivel."
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: oficina-db
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: oficina-db
                  key: DB_PORT
      containers:
        - name: app
          image: oficina-mecanica-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          # Nao sensivel (ConfigMap) + segredos da app (Secret oficina-app).
          envFrom:
            - configMapRef:
                name: oficina-app-config
            - secretRef:
                name: oficina-app
          # DATABASE_URL vem do Secret gerenciado pelo Terraform (oficina-db).
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oficina-db
                  key: DATABASE_URL
          # startup: da folga para o `prisma migrate deploy` do CMD antes de
          # liveness/readiness assumirem (ate ~150s).
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
