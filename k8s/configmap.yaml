# Variaveis de ambiente NAO sensiveis da aplicacao.
# Segredos (JWT_SECRET, tokens de webhook) ficam no Secret `oficina-app`
# (ver secret.yaml.example) e a DATABASE_URL vem do Secret `oficina-db`
# gerado pelo Terraform (US-F2-06).
apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-app-config
  labels:
    app.kubernetes.io/name: oficina-app
    app.kubernetes.io/part-of: oficina-mecanica
    app.kubernetes.io/managed-by: kustomize
data:
  NODE_ENV: "production"
  PORT: "3000"
  # Notificacoes: `mock` nao exige URL/secret externos — ideal para o demo em kind.
  # Troque para `webhook` e preencha NOTIFICATION_WEBHOOK_URL para enviar de verdade.
  NOTIFICATION_PROVIDER: "mock"
  NOTIFICATION_WEBHOOK_URL: ""
  NOTIFICATION_WEBHOOK_TIMEOUT_MS: "5000"
  JWT_EXPIRES_IN: "1h"
  # Origens permitidas no CORS. Ajuste para o dominio do front em producao.
  WEB_ORIGINS: "http://localhost:5173,http://localhost:5174"
  PUBLIC_BASE_URL: "http://localhost:3000"
